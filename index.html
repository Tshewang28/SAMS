<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SAMS - Student Assessment Management System
    </title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>

    <div class="login-page">


        <!-- LEFT SIDE -->

        <div class="login-brand">

            <div class="brand-content">

                <div class="brand-logo">
                    SAMS
                </div>

                <h1>
                    Student Assessment
                    <br>
                    Management System
                </h1>

                <p>
                    Secure and efficient management
                    of student assessment and
                    academic information.
                </p>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="login-area">

            <div class="login-card">


                <!-- LOGIN HEADER -->

                <div class="login-header">

                    <h2>
                        Welcome Back
                    </h2>

                    <p>
                        Sign in to your SAMS account
                    </p>

                </div>


                <!-- LOGIN FORM -->

                <form
                    id="loginForm"
                    autocomplete="on"
                >


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="loginEmail">
                            Educational Email
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="name@education.gov.bt"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <div class="password-box">

                            <input
                                type="password"
                                id="loginPassword"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <!-- OPTIONS -->

                    <div class="login-options">

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            <span>
                                Remember me
                            </span>

                        </label>


                        <button
                            type="button"
                            id="forgotPasswordBtn"
                            class="forgot-password"
                        >
                            Forgot password?
                        </button>

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="login-button"
                    >
                        Sign In
                    </button>


                    <!-- ERROR / MESSAGE -->

                    <div
                        id="loginMessage"
                        class="login-message"
                    ></div>


                </form>


                <!-- CREATE ACCOUNT -->

                <div class="create-account">

                    <span>
                        Don't have an account?
                    </span>

                    <button
                        type="button"
                        id="createAccountBtn"
                        class="create-account-btn"
                    >
                        Create Account
                    </button>

                </div>


            </div>

        </div>

    </div>


    <!-- ====================================== -->
    <!-- SUPABASE                               -->
    <!-- ====================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase-config.js"></script>
<script src="js/sams-cloud.js"></script>


    <!-- ====================================== -->
    <!-- LOGIN JAVASCRIPT                       -->
    <!-- ====================================== -->

    <script src="js/login.js?v=3"></script>


</body>

</html>
