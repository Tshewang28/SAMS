<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | SAMS</title>
  <style>
    :root{--navy:#123f70;--blue:#1f5f95;--bg:#f3f7fb;--text:#19324d;--muted:#657b91;--border:#d8e1ea}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text);padding:20px}
    .card{width:100%;max-width:460px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:34px;box-shadow:0 10px 35px rgba(18,63,112,.10)}
    .logo{width:64px;height:64px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;margin:0 auto 18px}
    h1{text-align:center;margin:0 0 8px;font-size:28px}.sub{text-align:center;color:var(--muted);margin:0 0 26px;line-height:1.5}
    label{display:block;font-weight:700;margin:15px 0 7px}.password-wrap{position:relative}.password-wrap input{padding-right:72px}
    input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:10px;font-size:16px;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,95,149,.10)}
    .show{position:absolute;right:8px;top:7px;border:0;background:transparent;color:var(--blue);font-weight:700;cursor:pointer;padding:7px}
    button.primary{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;cursor:pointer}button.primary:disabled{opacity:.65;cursor:not-allowed}
    .message{margin-top:16px;padding:11px 13px;border-radius:9px;display:none;line-height:1.45}.message.show{display:block}.message.error{background:#fff0f0;color:#a32929}.message.success{background:#eefaf2;color:#176b39}
    .back{text-align:center;margin-top:18px}.back a{color:var(--blue);text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">SAMS</div>
    <h1>Reset Password</h1>
    <p class="sub">Enter a new password for your SAMS account.</p>

    <form id="resetForm" novalidate>
      <label for="newPassword">New Password</label>
      <div class="password-wrap">
        <input id="newPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="Enter new password">
        <button type="button" class="show" data-target="newPassword">Show</button>
      </div>

      <label for="confirmPassword">Confirm Password</label>
      <div class="password-wrap">
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="Confirm new password">
        <button type="button" class="show" data-target="confirmPassword">Show</button>
      </div>

      <button id="updatePasswordBtn" class="primary" type="submit">Update Password</button>
      <div id="message" class="message" role="alert"></div>
    </form>

    <div class="back"><a href="index.html">← Back to Login</a></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script>
    (function(){
      'use strict';
      const form=document.getElementById('resetForm');
      const newPassword=document.getElementById('newPassword');
      const confirmPassword=document.getElementById('confirmPassword');
      const button=document.getElementById('updatePasswordBtn');
      const message=document.getElementById('message');

      function showMessage(text,type){
        message.textContent=text;
        message.className='message show '+(type||'');
      }

      document.querySelectorAll('.show').forEach(btn=>btn.addEventListener('click',()=>{
        const input=document.getElementById(btn.dataset.target);
        if(!input)return;
        const visible=input.type==='text';
        input.type=visible?'password':'text';
        btn.textContent=visible?'Show':'Hide';
      }));

      function checkRecoveryError(){
        const hash=window.location.hash.startsWith('#')?window.location.hash.slice(1):window.location.hash;
        if(!hash)return false;
        const params=new URLSearchParams(hash);
        const error=params.get('error_description') || params.get('error');
        if(error){
          showMessage(decodeURIComponent(error.replace(/\+/g,' ')),'error');
          button.disabled=true;
          return true;
        }
        return false;
      }

      if(!window.samsSupabase){
        showMessage('SAMS connection is not available. Please try again.','error');
        button.disabled=true;
      } else {
        checkRecoveryError();
        window.samsSupabase.auth.onAuthStateChange((event)=>{
          if(event==='PASSWORD_RECOVERY'){
            showMessage('Choose your new password below.','success');
            button.disabled=false;
          }
        });
      }

      form.addEventListener('submit',async(e)=>{
        e.preventDefault();
        if(!window.samsSupabase)return;
        const p=newPassword.value;
        const c=confirmPassword.value;
        if(p.length<6){showMessage('Password must contain at least 6 characters.','error');return;}
        if(p!==c){showMessage('Passwords do not match.','error');return;}
        button.disabled=true;
        button.textContent='Updating...';
        try{
          const {error}=await window.samsSupabase.auth.updateUser({password:p});
          if(error)throw error;
          showMessage('Password updated successfully. You can now log in with your new password.','success');
          form.reset();
          setTimeout(()=>window.location.replace('index.html'),1800);
        }catch(error){
          console.error('Password update error:',error);
          showMessage(error.message||'Unable to update password. Please request a new reset link.','error');
          button.disabled=false;
          button.textContent='Update Password';
        }
      });
    })();
  </script>
</body>
</html>
